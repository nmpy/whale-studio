name: Slack PR Notify

"on":
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed

jobs:
  notify:
    runs-on: ubuntu-latest
    if: >-
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true

    steps:
      - name: Verify Slack webhook secret is set
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error title=SLACK_WEBHOOK_URL is not configured::Repository secret SLACK_WEBHOOK_URL is empty or missing."
            exit 1
          fi      - name: Build payload and POST to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          set -euo pipefail

          if [ "$ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
            HEADLINE="✅ PR merged: ${PR_TITLE}"
            ACTOR_LABEL="Merged by"
            ACTOR_VALUE="${MERGED_BY:-unknown}"
          else
            case "$ACTION" in
              opened) VERB="opened" ;;
              reopened) VERB="reopened" ;;
              ready_for_review) VERB="ready for review" ;;
              *) VERB="$ACTION" ;;
            esac            HEADLINE="🟣 PR ${VERB}: ${PR_TITLE}"
            ACTOR_LABEL="Author"
            ACTOR_VALUE="$PR_AUTHOR"
          fi

          BRANCH_LINE="${PR_HEAD} → ${PR_BASE}"

          payload=$(jq -n \
            --arg headline "$HEADLINE" \
            --arg repo "$REPO" \
            --arg actorLabel "$ACTOR_LABEL" \
            --arg actorValue "$ACTOR_VALUE" \
            --arg branch "$BRANCH_LINE" \
            --arg url "$PR_URL" \
            '{
              text: ($headline
                + "\nRepository: " + $repo
                + "\n" + $actorLabel + ": " + $actorValue
                + "\nBranch: " + $branch
                + "\nURL: " + $url)
            }')

          curl -sfS -X POST \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
