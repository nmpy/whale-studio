name: Slack PR Notify

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged == true

    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          set -euo pipefail

          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not configured."
            exit 1
          fi

          if [ "$ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
            TITLE="PR merged: $PR_TITLE"
            USER_LABEL="Merged by"
            USER_VALUE="${MERGED_BY:-unknown}"
          else
            TITLE="PR $ACTION: $PR_TITLE"
            USER_LABEL="Author"
            USER_VALUE="$PR_AUTHOR"
          fi

          payload=$(jq -n \
            --arg title "$TITLE" \
            --arg repo "$REPO" \
            --arg userLabel "$USER_LABEL" \
            --arg userValue "$USER_VALUE" \
            --arg branch "$PR_HEAD -> $PR_BASE" \
            --arg url "$PR_URL" \
            '{
              text: ($title
                + "\nRepository: " + $repo
                + "\n" + $userLabel + ": " + $userValue
                + "\nBranch: " + $branch
                + "\nURL: " + $url)
            }')

          curl -f -X POST \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
